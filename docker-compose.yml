services:
  # Registro de servicios: Persistence se anota acá al arrancar.
  # UI para verificar en http://localhost:8500
  consul:
    image: hashicorp/consul:1.21
    command: agent -dev -client=0.0.0.0
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:latest
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  persistence:
    build: .
    environment:
      CONSUL_URL: http://consul:8500
      CONSUL_SERVICE_NAME: persistence
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: pdf_extractext
    ports:
      - "127.0.0.1:8003:8000"
    # Endurecimiento: sin capacidades Linux, sin escalada por SUID y
    # filesystem de solo lectura (la app no escribe en disco).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    depends_on:
      consul:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo_data: